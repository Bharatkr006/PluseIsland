name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle Cache and Wrapper
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate APK
        if: always()
        run: find app/build/outputs -name "*.apk" 2>/dev/null || echo "No APK found"

      - name: Upload Minimal Debug APK (Safe from sensitive data warning)
        uses: actions/upload-artifact@v4
        with:
          name: PulseIsland-minimal-debug-apk
          path: app/build/outputs/apk/minimal/debug/*.apk
          if-no-files-found: error

      - name: Upload Full Debug APK (Includes music integration)
        uses: actions/upload-artifact@v4
        with:
          name: PulseIsland-full-debug-apk
          path: app/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error

      - name: Upload Build Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: app/build/reports/
